// ── Relatório provisório (evolução de carga por aluno/exercício) ──
const EXALL = (function(){ const m={}; Object.values(MESES).forEach(mes=>Object.values(mes).flat().forEach(e=>{ m[e.id]=e.nome; })); return m; })();
function repFiltrados(){
  const aId=$("repAluno").value, eId=$("repExercicio").value, de=$("repDe").value, ate=$("repAte").value;
  return records.filter(r=>
    (!aId || r.alunoId===aId) && (!eId || r.exercicioId===eId) &&
    (!de || r.data>=de) && (!ate || r.data<=ate)
  ).sort((a,b)=>b.data.localeCompare(a.data));
}
function renderRelatorio(){
  const aSel=$("repAluno"), eSel=$("repExercicio"); const curA=aSel.value, curE=eSel.value;
  const alunosOrd=[...alunos].sort((x,y)=>x.nome.localeCompare(y.nome,"pt"));
  aSel.innerHTML = `<option value="">todos os alunos</option>` + alunosOrd.map(a=>`<option value="${a.id}">${he(a.nome)}</option>`).join("");
  // inclui exercícios adaptados (id ~aluno) que aparecem nos registros mas não estão no MESES
  const adaptIds=[...new Set(records.map(r=>r.exercicioId))].filter(id=>!EXALL[id]);
  eSel.innerHTML = `<option value="">todos os exercícios</option>`
    + Object.keys(EXALL).map(id=>`<option value="${id}">${he(EXALL[id])}</option>`).join("")
    + adaptIds.map(id=>`<option value="${id}">${he(nomeEx(id))} (adaptado)</option>`).join("");
  aSel.value=curA; eSel.value=curE;

  const rows=repFiltrados();
  const comCarga=rows.filter(r=>r.cargaTotal!=="" && r.cargaTotal!=null).map(r=>({d:r.data, v:parseFloat(r.cargaTotal)})).filter(x=>!isNaN(x.v));
  let kpis="";
  if(aSel.value && eSel.value && comCarga.length){
    const porData=[...comCarga].sort((a,b)=>a.d.localeCompare(b.d));
    const ultima=porData[porData.length-1].v;
    const anterior=porData.length>1?porData[porData.length-2].v:null;
    const melhor=Math.max(...comCarga.map(x=>x.v));
    const delta=anterior!=null?Math.round((ultima-anterior)*10)/10:null;
    kpis=`
      <div class="kpi"><div class="kl">Última carga</div><div class="kv">${ultima}<small> kg</small></div></div>
      <div class="kpi"><div class="kl">Melhor carga</div><div class="kv">${melhor}<small> kg</small></div></div>
      <div class="kpi"><div class="kl">Δ vs. sessão anterior</div><div class="kv">${delta!=null?(delta>0?"+":"")+delta:"—"}<small>${delta!=null?" kg":""}</small></div></div>`;
  }
  $("repKpis").innerHTML=kpis;
  $("repCharts").innerHTML=chartsBlock();
  $("repTabela").innerHTML=tabelaHTML(rows);
}

// tabela cronológica do relatório (reusada na tela e no PDF)
function tabelaHTML(rows){
  if(!rows.length) return `<p class="muted">Sem registros para esse filtro.</p>`;
  const trs=rows.map(r=>{
    const carga = (r.cargaTotal!==""&&r.cargaTotal!=null) ? he(r.cargaTotal)+" kg" : (r.cargaParcial?he(r.cargaParcial):"—");
    const montagem = r.cargaParcial? he(r.cargaParcial) : "—";
    const flags=[ r.naoRealizou?"✕ não realizou":"", (r.dor||r.dorNota)?"⚠ "+he(r.dorNota||"dor"):"", r.troca?"↻ "+he(r.troca):"", r.obs?he(r.obs):"" ].filter(Boolean).join(" · ");
    return `<tr>
      <td>${fmtD(r.data)}</td><td>T${he(r.treino)} · B${he(r.bloco)}</td>
      <td>${he(r.alunoNome)}</td><td>${he(r.exercicioNome)}</td>
      <td class="num">${carga}</td><td>${montagem}</td><td>${he(r.reps||"—")}</td><td>${he(r.rr||"—")}</td>
      <td>${flags||""}</td></tr>`;
  }).join("");
  return `<table class="reptab"><thead><tr>
    <th>Data</th><th>Treino</th><th>Aluno</th><th>Exercício</th><th>Carga</th><th>Montagem</th><th>Reps</th><th>RR</th><th>Dor / troca / obs</th>
  </tr></thead><tbody>${trs}</tbody></table>`;
}

// série de carga (kg) + reps de um aluno+exercício, no filtro de datas, ordenada por data
function serieCarga(aId, exId){
  const de=$("repDe").value, ate=$("repAte").value;
  return records.filter(r=> r.alunoId===aId && r.exercicioId===exId
      && r.cargaTotal!=="" && r.cargaTotal!=null && !isNaN(parseFloat(r.cargaTotal))
      && (!de||r.data>=de) && (!ate||r.data<=ate))
    .map(r=>({d:r.data, v:parseFloat(r.cargaTotal), reps:(r.reps||"").toString().trim()}))
    .sort((a,b)=>a.d.localeCompare(b.d));
}

// gráfico de linha em SVG puro (sem libs) — evolução de carga
function chartSVG(pts, opt){
  opt=opt||{}; const w=opt.w||300, h=opt.h||140, pad={l:32,r:14,t:20,b:34};
  if(!pts.length) return `<div class="muted" style="padding:10px 0">sem carga registrada</div>`;
  const vs=pts.map(p=>p.v), vmin=Math.min(...vs), vmax=Math.max(...vs), span=(vmax-vmin)||1;
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const X=i=> pad.l + (pts.length===1? iw/2 : iw*i/(pts.length-1));
  const Y=v=> pad.t + ih - ih*(v-vmin)/span;
  const baseY=pad.t+ih;
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  // por ponto: carga ACIMA do ponto (linha/terracota) e reps ABAIXO, na base (cinza) — amarra carga↔reps
  const marks=pts.map((p,i)=>{
    const x=X(i).toFixed(1), y=Y(p.v).toFixed(1);
    const carga=`<text x="${x}" y="${(Y(p.v)-7).toFixed(1)}" text-anchor="middle" class="cval">${p.v}</text>`;
    const reps = p.reps ? `<text x="${x}" y="${(baseY+13).toFixed(1)}" text-anchor="middle" class="creps">${he(p.reps)}</text>` : "";
    return `<circle cx="${x}" cy="${y}" r="3" fill="var(--info)"/>${carga}${reps}`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="xMidYMid meet" role="img">
    <line class="grid" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${baseY.toFixed(1)}"/>
    <line class="grid" x1="${pad.l}" y1="${baseY.toFixed(1)}" x2="${w-pad.r}" y2="${baseY.toFixed(1)}"/>
    <text x="${pad.l}" y="${(baseY+25).toFixed(1)}" class="cax">${fmtD(pts[0].d)}</text>
    <text x="${w-pad.r}" y="${(baseY+25).toFixed(1)}" class="cax" text-anchor="end">${fmtD(pts[pts.length-1].d)}</text>
    <text x="2" y="10" class="cax">kg</text>
    <text x="2" y="${(baseY+13).toFixed(1)}" class="creps">reps</text>
    <path d="${d}" fill="none" stroke="var(--info)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks}
  </svg>`;
}

// bloco de gráficos do aluno selecionado (1 grande se exercício escolhido; senão small-multiples)
function chartsBlock(){
  const aId=$("repAluno").value, eId=$("repExercicio").value;
  if(!aId) return `<p class="muted">Selecione um aluno para ver os gráficos de evolução de carga.</p>`;
  const idsCand = new Set([...Object.keys(EXALL), ...records.filter(r=>r.alunoId===aId).map(r=>r.exercicioId)]);
  // filtra sempre por série não-vazia (mesmo com exercício escolhido) — evita crash em pc/tempo/elástico
  const exIds = [...idsCand].filter(x=> (!eId || x===eId) && serieCarga(aId,x).length);
  if(!exIds.length) return `<p class="muted">Sem carga registrada para esse aluno no período (peso corporal/tempo/elástico não têm gráfico de kg).</p>`;
  const big=!!eId;
  return `<div class="charts ${big?'one':''}">` + exIds.map(ex=>{
    const s=serieCarga(aId,ex); const last=s[s.length-1].v, best=Math.max(...s.map(p=>p.v));
    return `<div class="chartcard">
      <div class="chartt">${he(nomeExDe(ex,aId))}</div>
      <div class="chartmeta">última <b>${last}kg</b> · melhor <b>${best}kg</b> · ${s.length} ${s.length===1?'sessão':'sessões'}</div>
      ${chartSVG(s,{w:big?560:300,h:big?230:130})}
    </div>`;
  }).join("") + `</div>`;
}

// gera o PDF (via impressão) do aluno selecionado, pra enviar individual
function gerarPDF(){
  const aId=$("repAluno").value;
  if(!aId){ alert("Selecione um aluno no filtro para gerar o PDF."); return; }
  const aluno=alunos.find(a=>a.id===aId)||{nome:aId};
  const rows=repFiltrados();
  const ds=rows.map(r=>r.data).sort();
  const periodo = ds.length? `${fmtD(ds[0])} a ${fmtD(ds[ds.length-1])}` : "sem registros";
  $("printArea").innerHTML = `
    <div class="pdfhead">
      <div class="pdfbrand">Fabrik — Evolução de Carga</div>
      <div class="pdfsub">${he(aluno.nome)} · período ${periodo} · gerado em ${fmtD(today())}</div>
    </div>
    ${chartsBlock()}
    <h3 class="pdfh">Histórico</h3>
    ${tabelaHTML(rows)}
    <div class="pdffoot">Registro de Carga · visão provisória · Fabrik Studio</div>`;
  window.print();
}

document.addEventListener("click",e=>{ const d=e.target.closest(".dica"); // explicações na palavra: clique abre/fecha, clique fora fecha
  document.querySelectorAll(".dica.on").forEach(x=>{ if(x!==d) x.classList.remove("on"); }); if(d) d.classList.toggle("on"); });
document.addEventListener("keydown",e=>{ const d=e.target.closest&&e.target.closest(".dica"); if(d&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); d.classList.toggle("on"); } if(e.key==="Escape") document.querySelectorAll(".dica.on").forEach(x=>x.classList.remove("on")); });
document.addEventListener("click",e=>{ document.querySelectorAll("details.evoinfo[open]").forEach(d=>{ if(!d.contains(e.target)) d.open=false; }); }); // ⓘ do EVO fecha ao tocar fora
// "Salvo hh:mm:ss" e avisos ⚠ aparecem flutuando embaixo (no rodapé ficavam fora da vista)
(function(){ const s=$("status"); let tm;
  new MutationObserver(()=>{ const t=s.textContent.trim(); clearTimeout(tm);
    if(!t){ s.classList.remove("show"); return; }
    const w=t.startsWith("⚠"); s.classList.toggle("warn",w); s.classList.add("show");
    tm=setTimeout(()=>s.classList.remove("show"), w?7000:1800);
  }).observe(s,{childList:true,characterData:true,subtree:true}); })();

// exporta TUDO que está guardado neste navegador (inclui o que não subiu) — recuperação de dado
function exportarPendencias(){
  const dump = {
    exportadoEm: new Date().toISOString(),
    device: load("fabrik_device", null),
    cargas: load("fabrik_cargas", []),
    fila: load("fabrik_syncqueue", []),
    falhou: load("fabrik_sync_falhou", [])
  };
  const blob=new Blob([JSON.stringify(dump)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fabrik_pendencias_"+today()+".json"; a.click();
  const datas={}; dump.cargas.forEach(r=>{ datas[r.data]=(datas[r.data]||0)+1; });
  alert("Backup local baixado.\n\nRegistros locais: "+dump.cargas.length+
        "\nNa fila (não subiram): "+dump.fila.length+
        "\nIsolados por erro: "+dump.falhou.length+
        "\n\nEnvie o arquivo fabrik_pendencias_*.json pro suporte.");
}
