      const repsBox = (ex.repsFixas ? `<div class="grp"><span>Reps</span><span class="fixed" title="Fixo na prescrição">${he(ex.repsFixas)}</span></div>` :
        `<div class="grp"><span>Reps</span><input class="sm" data-f="reps" inputmode="numeric" placeholder="—" value="${attrEsc(r.alunoId ? (r.reps||"") : repsPrescritas(ex,c.data))}"></div>`)+
        (ex.rrFixo ? `<div class="grp"><span>RR</span><span class="fixed" title="Potência: longe da falha, PSE até 4 (esforço leve) · Helms et al. 2016">${he(ex.rrFixo)}</span></div>` :
        ex.repsFixas ? "" : `<div class="grp"><span>RR</span><input class="sm" data-f="rr" placeholder="—" value="${attrEsc(r.rr||"")}"></div>`);
      const aTipo = ex0.adaptado? ex0.tipo : "carga";
      const aImpl = (ex0.adaptado&&ex0.carga) ? ex0.carga : "impl";
      const adaptChip = ex.adaptado? `<span class="adaptado" title="original da turma: ${attrEsc(ex.origNome)}">adaptado</span>` : "";
      const ab=(k,v,cur,txt)=>`<button class="abtn ${cur===v?'on':''}" data-${k}="${v}">${txt}</button>`;
      const adaptForm = `<div class="adapt-edit">
          <input class="adapt-nome" placeholder="Exercício adaptado deste aluno (vira o padrão dele)" value="${ex.adaptado?attrEsc(ex.nome):''}">
          <div class="adapt-row"><div class="grp"><span>Tipo</span><div class="seg atipo">${ab("t","carga",aTipo,"Carga")}${ab("t","pc",aTipo,"Peso corp.")}${ab("t","elastico",aTipo,"Elástico")}${ab("t","tempo",aTipo,"Tempo")}</div></div>
            <div class="grp aimpl" style="${aTipo==='carga'?'':'display:none'}"><span>Implemento</span><div class="seg">${ab("i","impl",aImpl,"DB")}${ab("i","kb",aImpl,"KB")}${ab("i","barra",aImpl,"BB")}</div></div></div>
          <div class="adapt-acts"><button class="btn-primary adapt-salvar">Salvar como padrão do aluno</button>${ex.adaptado?`<button class="ghost adapt-voltar">Voltar ao original</button>`:""}</div>
        </div>`;
      return `<div class="exline${r.naoRealizou?" nao":""}" data-aluno="${a.id}" data-ex="${ex.id}" data-slot="${exSlot.id}">
        <div class="exhead"><span class="ex">${nomeDica(ex)}</span>${vid(ex.nome)}${adaptChip}${ex.presc?`<span class="presc">${prescDica(ex)}</span>`:""}<span class="alvo">alvo ${he(ex.alvo)}</span></div>
        <div class="exacts">
          <button class="act btn-troca" title="Trocou só hoje (não vira padrão)">${IC("repeat")}<span>Trocar</span></button>
          <button class="act btn-dor" title="Anotar dor de hoje">${IC("alert")}<span>Dor</span></button>
          <button class="act btn-obs" title="Observação de hoje">${IC("note")}<span>Obs</span></button>
          <button class="act btn-nao${r.naoRealizou?" open":""}" title="Não fez hoje (fica no histórico como não realizado)">${IC("x")}<span>Não realizou</span></button>
          <span class="asep"></span>
          <button class="act btn-adapt" title="Adaptar o exercício: vira o padrão deste aluno nas próximas semanas deste treino">${IC("swap")}<span>Adaptar</span></button>
        </div>
        <div class="row">${ex.soTempo && ex.tempoSeries ? (()=>{ const v=String(r.reps||"").split("/"); // uma caixa por série; grava "40/35" em reps
          return Array.from({length:ex.tempoSeries},(_,i)=>`<div class="grp"><span>Série ${i+1}</span><input class="sm tser" data-i="${i}" inputmode="numeric" placeholder="mm:ss" value="${attrEsc(segParaMMSS(v[i]))}"></div>`).join(""); })()
          : ex.soTempo ? `<div class="grp"><span>Tempo</span><input class="sm" data-f="reps" inputmode="numeric" placeholder="—" value="${attrEsc(r.reps||"")}"><small>s</small></div>` : `${cargaBox}<span class="vsep"></span>${repsBox}`}</div>
        ${adaptForm}
        <div class="troca-edit"><input data-f="troca" placeholder="Trocou só hoje? Anote o exercício (não vira padrão)" value="${attrEsc(r.troca||"")}"></div>
        <div class="dor-edit"><input data-f="dorNota" placeholder="O que foi? (ex: joelho D, amplitude parcial)" value="${attrEsc(r.dorNota||"")}"></div>
        <div class="obs-edit"><input data-f="obs" placeholder="Observação (cansaço, técnica…)" value="${attrEsc(r.obs||"")}"></div>
        <div class="tags"></div>
        ${histBlock(a.id,ex.id,c.data,ex.soTempo)}
      </div>`;
    }).join("");
    return `<div class="scard"><div class="shead"><div class="avatar">${initials(a.nome)}</div><div class="nm">${he(a.nome)}</div><span class="pendbadge"></span><button class="iconbtn btn-rename" data-aluno="${a.id}" title="Renomear aluno" aria-label="Renomear aluno">${IC("pencil")}</button></div>${lines}</div>`;
  }).join("");
  if(!$("panel").innerHTML.trim()) $("panel").innerHTML=`<p class="muted">Nenhum aluno listado tem exercício com carga neste bloco.</p>`;
  wirePanel(c);
}

function wirePanel(c){
  $("panel").querySelectorAll(".exline").forEach(line=>{
    const aId=line.dataset.aluno, exId=line.dataset.ex, slotId=line.dataset.slot;
    const aluno=alunos.find(a=>a.id===aId);
    const exSlot=treinosDo(c.mes)[c.treino].find(e=>e.id===slotId);
    const ex=exHoje(exEfetivo(exSlot,aId,c),getRec(c,aId,exId)); // efetivo + implemento de hoje; ex.id === exId
    const tags=()=>{ const r=getRec(c,aId,exId)||{}; let t="";
      if(r.naoRealizou) t+=`<span class="tag nao">${IC("x")}Não realizou</span>`;
      if(r.dor||r.dorNota) t+=`<span class="tag dor">${IC("alert")}${he(r.dorNota||"dor")}</span>`;
      if(r.troca) t+=`<span class="tag troca">${IC("repeat")}${he(r.troca)}</span>`;
      if(r.obs) t+=`<span class="tag obs">${IC("note")}${he(r.obs)}</span>`;
      const sug=(r.troca||r.naoRealizou)?null:trocaAnterior(aId,exId,c.data);
      if(sug) t+=`<button type="button" class="tag reuse" title="Usa a mesma troca só hoje (não vira padrão)">${IC("repeat")}Repetir troca de ${fmtD(sug.data)}: ${he(sug.troca)}</button>`;
      line.querySelector(".tags").innerHTML=t;
      const rb=line.querySelector(".tag.reuse");
      if(rb) rb.onclick=()=>{ upsert(c,aluno,ex,{troca:sug.troca}); const ti=line.querySelector('input[data-f="troca"]'); if(ti) ti.value=sug.troca; tags(); flagReps(); }; };
    tags();
    // realça os campos ainda não preenchidos (anti-esquecimento) + selo de pendências no card
    const repsInp=line.querySelector('input[data-f="reps"]');
    const card=line.closest(".scard");
    const flagReps=()=>{
      const r=getRec(c,aId,exId)||{}; const falta=faltando(ex,r);
      const pre=!getRec(c,aId,exId) && !!repsPrescritas(ex,c.data); // reps já sugeridas pela prescrição
      line.classList.toggle("pend", falta.length>0 && !(pre && ex.tipo==="pc"));
      line.classList.toggle("nao", !!r.naoRealizou); line.querySelector(".btn-nao").classList.toggle("open", !!r.naoRealizou);
      if(repsInp) repsInp.classList.toggle("faltou", falta.includes("reps") && !pre);
      const pesoInp=line.querySelector('.cbox .cin[data-c="peso"]'); if(pesoInp) pesoInp.classList.toggle("faltou", falta.includes("carga"));
      const chips=line.querySelector('.elchips'); if(chips) chips.classList.toggle("faltou", falta.includes("nivel"));
      line.querySelectorAll('.cxchips').forEach(x=>x.classList.toggle("faltou", falta.includes("altura")));
      const mbx=line.querySelector('.medb'); if(mbx) mbx.classList.toggle("faltou", falta.includes("medball"));
      if(card){ const n=card.querySelectorAll(".exline.pend").length; const b=card.querySelector(".pendbadge");
        if(b){ b.textContent = n? n+" pendente"+(n>1?"s":"") : "completo"; b.classList.toggle("ok", n===0); } }
    };
    flagReps();
    const tser=[...line.querySelectorAll("input.tser")];
    tser.forEach(inp=>inp.addEventListener("input",()=>{ // máscara: 130 → 1:30
      const d=inp.value.replace(/\D/g,"").slice(0,4); inp.value = d.length>2 ? d.slice(0,-2)+":"+d.slice(-2) : d; }));
    tser.forEach(inp=>inp.addEventListener("change",()=>{
      tser.forEach(x=>{ x.value=segParaMMSS(mmssParaSeg(x.value)); });
      const vs=tser.map(x=>mmssParaSeg(x.value)); while(vs.length && !vs[vs.length-1]) vs.pop();
      upsert(c,aluno,ex,{reps:vs.join("/")}); tags(); flagReps();
    }));
    line.querySelectorAll("input[data-f]").forEach(inp=>inp.addEventListener("change",()=>{
      const p={}; p[inp.dataset.f]=inp.value;
      if(inp.dataset.f==="dorNota") p.dor=!!inp.value;
      upsert(c,aluno,ex,p); tags();
      if(inp.dataset.f==="reps"){ const v=inp.value.trim(); if(/^\d+$/.test(v) && +v>50) $("status").textContent="⚠ "+v+" reps? confira (possível erro de digitação)"; }
      flagReps();
    }));
    if(ex.tipo==="carga"){
      const gv=sel=>{const e=line.querySelector(sel);return e?e.value:"";};
      const recompCarga=()=>{
        const box=line.querySelector(".cbox"); if(!box) return;
        const montagem=box.dataset.tipo;
        const ub=line.querySelector('[data-c="un"].on'); const un=ub?ub.dataset.v:'kg';
        const ub2=line.querySelector('[data-c="un2"].on'); const un2=ub2?ub2.dataset.v:'kg';
        const qb=line.querySelector('.qbtn.on'); const qtd=qb?qb.dataset.v:1;
        const bb=line.querySelector(".barb");
        const peso=gv('[data-c="peso"]'), peso2=gv('[data-c="peso2"]'), bar=bb?bb.value:"";
        const out=calcCarga(montagem,qtd,peso,un,peso2,un2,bar);
        line.querySelector('.ctotal').textContent=out.total||'—';
        upsert(c,aluno,ex,{montagem,qtd:String(qtd),peso:String(peso||""),un,peso2:String(peso2||""),un2,bar:String(bar),cargaParcial:ex.caixa?juntaCaixa(out.parcial,altDe((getRec(c,aId,exId)||{}).cargaParcial)):out.parcial,cargaTotal:out.total});
        flagReps();
      };
      line.querySelectorAll("[data-c]").forEach(el=>{
        if(el.tagName==="BUTTON"){ el.onclick=()=>{ line.querySelectorAll(`[data-c="${el.dataset.c}"]`).forEach(b=>b.classList.toggle("on", b===el)); recompCarga(); }; }
        else { el.addEventListener("change",recompCarga); }
      });
      const aA=line.querySelector('.addAnilha');
      if(aA) aA.onclick=()=>{ const g=line.querySelector('.anilha2'); g.style.display=''; aA.style.display='none'; const i=g.querySelector('input'); if(i)i.focus(); };
      const bb=line.querySelector(".barb");
      if(bb) bb.onclick=()=>abrirFolha(aluno.nome+" · Barra", BARRAS.map(v=>[v,v,"kg"]), bb.value, v=>{ bb.value=v; bb.textContent=v; recompCarga(); }, bb);
    }
    const mbb=line.querySelector(".medb");
    if(mbb) mbb.onclick=()=>abrirFolha(aluno.nome+" · Medball", ex.medball.map(v=>[v,v,"lb"]), mbb.value, v=>{
      mbb.value=v; mbb.textContent=v;
      upsert(c,aluno,ex,{montagem:"medball",cargaParcial:v+" lb",cargaTotal:String(Math.round(v*0.45359237*10)/10)});
      flagReps();
    }, mbb);
    // implemento de hoje: a lista abre ao tocar, com o de hoje marcado
    const ib=line.querySelector(".impb:not(.barb)");
    if(ib) ib.onclick=()=>abrirFolha(aluno.nome+" · "+ex.nome, IMPLEMENTOS.map(([v,s,n])=>[v,s,n]), ex.montHoje, v=>trocaImpl(c,aluno,ex,v), ib);
    if(ex.tipo==="elastico"){
      // nível de resistência (ordinal, não é kg): guarda o nome em cargaParcial, sem cargaTotal
      line.querySelectorAll(".elch").forEach(b=>b.onclick=()=>{
        line.querySelectorAll(".elch").forEach(x=>x.classList.toggle("on", x===b));
        upsert(c,aluno,ex,{montagem:"elastico",cargaParcial:b.dataset.nivel,cargaTotal:""});
        flagReps();
      });
    }
    // auxílio da superband (opcional): tocar de novo desmarca; guarda em cargaParcial, sem cargaTotal
    line.querySelectorAll(".elch.aux").forEach(b=>b.onclick=()=>{
      const liga=!b.classList.contains("on");
      line.querySelectorAll(".elch.aux").forEach(x=>x.classList.toggle("on", x===b && liga));
      upsert(c,aluno,ex,{cargaParcial: liga ? AUX_SB+b.dataset.nivel : "", cargaTotal:""});
      flagReps();
    });
    line.querySelectorAll(".cxa").forEach(b=>b.onclick=()=>{
      const alt=b.classList.contains("on") ? "" : b.dataset.alt;
      line.querySelectorAll(".cxa").forEach(x=>x.classList.toggle("on", x===b && !!alt));
      upsert(c,aluno,ex,{cargaParcial:juntaCaixa((getRec(c,aId,exId)||{}).cargaParcial,alt)});
      flagReps();
    });
    if(ex.tipo==="caixa"){
      // altura da caixa (cm, não é carga): guarda em cargaParcial ("45 cm"), sem cargaTotal
      line.querySelectorAll(".cxch").forEach(b=>b.onclick=()=>{
        line.querySelectorAll(".cxch").forEach(x=>x.classList.toggle("on", x===b));
        upsert(c,aluno,ex,{montagem:"caixa",cargaParcial:b.dataset.alt,cargaTotal:""});
        flagReps();
      });
    }
    // adaptação individual: vira o padrão do aluno (reaparece nas próximas semanas)
    line.querySelector(".btn-adapt").onclick=function(){ tog(line,".adapt-edit",this); };
    const adaptEdit=line.querySelector(".adapt-edit");
    if(adaptEdit){
      adaptEdit.querySelectorAll(".atipo .abtn").forEach(b=>b.onclick=()=>{
        adaptEdit.querySelectorAll(".atipo .abtn").forEach(x=>x.classList.toggle("on",x===b));
        adaptEdit.querySelector(".aimpl").style.display = b.dataset.t==="carga"?"flex":"none";
      });
      adaptEdit.querySelectorAll(".aimpl .abtn").forEach(b=>b.onclick=()=>{
        adaptEdit.querySelectorAll(".aimpl .abtn").forEach(x=>x.classList.toggle("on",x===b));
      });
      adaptEdit.querySelector(".adapt-salvar").onclick=()=>{
        const nome=adaptEdit.querySelector(".adapt-nome").value.trim();
        if(!nome){ $("status").textContent="⚠ Escreva o nome do exercício adaptado"; return; }
        const tb=adaptEdit.querySelector(".atipo .abtn.on"), ib=adaptEdit.querySelector(".aimpl .abtn.on");
        const tp=tb?tb.dataset.t:"carga";
        const def={ nome, tipo:tp };
        if(tp==="carga"){ def.carga=ib?ib.dataset.i:"impl"; def.un="kg"; def.qtd=1; }
        saveAdapt(aId,c,slotId,def);
        const rec=getRec(c,aId,slotId); if(rec){ rec.exercicioNome=nome; DataStore.putRegistro(rec); } // registro de hoje herda o nome
        renderPanel();
      };
      const volta=adaptEdit.querySelector(".adapt-voltar");
      if(volta) volta.onclick=()=>{ if(confirm("Voltar ao exercício original da turma? A adaptação deste aluno sai (o histórico do adaptado continua salvo).")){ saveAdapt(aId,c,slotId,null); renderPanel(); } };
    }
    line.querySelector(".btn-troca").onclick=function(){ tog(line,".troca-edit",this); };
    line.querySelector(".btn-dor").onclick=function(){ tog(line,".dor-edit",this); };
    line.querySelector(".btn-obs").onclick=function(){ tog(line,".obs-edit",this); };
    line.querySelector(".btn-nao").onclick=()=>{
      const r=getRec(c,aId,exId)||{};
      if(r.naoRealizou){ upsert(c,aluno,ex,{naoRealizou:false,reps:repsPrescritas(ex,c.data)}); renderPanel(); return; }
      const tem=v=>String(v||"").trim()!=="";
      const digitou=[r.cargaTotal,r.cargaParcial,r.peso,r.peso2,r.troca].some(tem) || (!ex.repsFixas && tem(r.reps) && String(r.reps)!==repsPrescritas(ex,c.data)) || (!ex.rrFixo && tem(r.rr));
      if(digitou && !confirm("Marcar "+ex.nome+" como não realizado? A carga, as reps e a troca anotadas hoje saem.")) return;
      upsert(c,aluno,ex,{naoRealizou:true,peso:"",peso2:"",cargaParcial:"",cargaTotal:"",reps:"",rr:"",troca:""});
      renderPanel();
    };
  });
  $("panel").querySelectorAll(".btn-rename").forEach(b=>b.onclick=()=>renameAluno(b.dataset.aluno));
}
function tog(line,sel,btn){ const el=line.querySelector(sel); const open=el.style.display==="block"; el.style.display=open?"none":"block"; if(btn) btn.classList.toggle("open",!open); const i=el.querySelector("input"); if(i&&!open)i.focus(); }

function renameAluno(id){
  const a=alunos.find(x=>x.id===id); if(!a)return;
  const n=prompt("Editar nome do aluno:",a.nome); if(!n||!n.trim())return;
  a.nome=n.trim(); records.forEach(r=>{ if(r.alunoId===id) r.alunoNome=a.nome; });
  DataStore.putAluno(a); save("fabrik_cargas",records); DataStore.touchRegistrosDoAluno(id); afterChange();
}
function deleteAluno(id){
  const a=alunos.find(x=>x.id===id); if(!a)return;
  if(!confirm("Excluir "+a.nome+" do cadastro geral?\n\nSai de todas as turmas. O histórico de cargas continua salvo e sai no CSV."))return;
  alunos=alunos.filter(x=>x.id!==id); DataStore.delAluno(id); afterChange();
}
function toggleTurma(id,t){
  const a=alunos.find(x=>x.id===id); if(!a)return;
  a.turmas = a.turmas.includes(t) ? a.turmas.filter(x=>x!==t) : [...a.turmas,t];
  DataStore.putAluno(a); renderMaster();
}

function renderDup(){
  const q=norm($("novoNome").value);
  if(!q){ $("dupWarn").innerHTML=""; return; }
  const m=alunos.filter(a=>norm(a.nome).includes(q)).slice(0,8);
  const exact=alunos.some(a=>norm(a.nome)===q);
  if(!m.length){ $("dupWarn").innerHTML=`<span class="okx">nome novo — ninguém parecido</span>`; return; }
  $("dupWarn").innerHTML = (exact?`<span class="warnx">⚠ já existe exatamente este nome:</span>`:`<span class="warnx">já tem parecido:</span>`) + " " + m.map(a=>`<span class="dupname">${he(a.nome)}</span>`).join("");
}
function addAluno(){
  const nome=$("novoNome").value.trim(); if(!nome)return;
  if(alunos.some(a=>norm(a.nome)===norm(nome)) && !confirm("Já existe um aluno com esse nome. Cadastrar outro mesmo assim?"))return;
  const novo={id:uniqueId(nome),nome,turmas:[]}; alunos.push(novo);
  DataStore.putAluno(novo);
  $("novoNome").value=""; $("dupWarn").innerHTML=""; $("novoNome").focus();
  renderMaster();
}

function renderMaster(){
  const q=norm($("filtroMaster").value);
  const list=alunos.filter(a=>norm(a.nome).includes(q)).sort((x,y)=>x.nome.localeCompare(y.nome,"pt"));
  $("masterCount").textContent=alunos.length+" alunos no cadastro";
  $("masterList").innerHTML = list.length ? list.map(a=>`
    <div class="mrow">
      <div class="mtop"><span class="mnome">${he(a.nome)}</span>
        <button class="icbtn" data-act="ren" data-id="${a.id}">${IC("pencil")}Renomear</button>
        <button class="icbtn ghost" data-act="del" data-id="${a.id}">Excluir</button>
      </div>
      <div class="hchips">${TURMAS.map(t=>`<span class="hchip ${a.turmas.includes(t)?'on':''}" data-id="${a.id}" data-t="${t}">${t}</span>`).join("")}</div>
    </div>`).join("") : `<p class="muted">Nenhum aluno encontrado.</p>`;
  $("masterList").querySelectorAll(".icbtn").forEach(b=>b.onclick=()=> b.dataset.act==="ren"?renameAluno(b.dataset.id):deleteAluno(b.dataset.id));
  $("masterList").querySelectorAll(".hchip").forEach(c=>c.onclick=()=>toggleTurma(c.dataset.id,c.dataset.t));
}

function exportCSV(rows, fname){
  rows = rows || records;
  if(!rows.length){ alert("Nada pra exportar ainda."); return; }
  const cols=["data","turma","treino","bloco","semana","alunoNome","exercicioNome","metodo","cargaParcial","cargaTotal","reps","rr","troca","naoRealizou","dorNota","obs"];
  const head=["Data","Turma","Treino","Bloco","Semana","Aluno","Exercício","Método","Carga parcial","Carga (kg)","Reps","RR","Trocado por","Não realizou","Dor","Obs"];
  const esc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[head.map(esc).join(",")].concat(rows.map(r=>cols.map(k=>esc(k==="naoRealizou"?(r.naoRealizou?"sim":""):r[k])).join(",")));
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(fname||"fabrik_cargas_"+today())+".csv"; a.click();
}

// ── status de sync (visível só no modo Supabase) ──────────────────
function setSync(txt, cls){
  const b=$("syncBadge"); if(b){ b.textContent=txt; b.className="syncbadge"+(cls?" "+cls:""); }
  const ban=$("syncBanner"); if(!ban) return;
  if(cls==="warn"){ // não-sincronizado: faixa visível + reassurance + tentar de novo
    ban.innerHTML = `${IC("alert")}<span>${he(txt)} · seus lançamentos estão salvos no aparelho</span><button class="icbtn" id="banSync">${IC("sync")}Tentar sincronizar</button>`;
    ban.style.display="flex";
    const bs=$("banSync"); if(bs) bs.onclick=reconectar;
  } else { ban.style.display="none"; ban.innerHTML=""; }
}

// ── login (modo Supabase) ─────────────────────────────────────────
function showLogin(){ $("loginOverlay").classList.add("on"); $("loginEmail").focus(); }
function hideLogin(){ $("loginOverlay").classList.remove("on"); }
async function doLogin(){
  const email=$("loginEmail").value.trim(), pw=$("loginSenha").value;
  if(!email||!pw){ $("loginErro").textContent="Preencha e-mail e senha."; return; }
  $("loginErro").textContent="entrando…";
  try{
    const { error } = await DataStore.sb.auth.signInWithPassword({ email, password:pw });
    if(error) throw error;
    $("loginSenha").value=""; $("loginErro").textContent=""; hideLogin();
    await DataStore.syncNow();
  }catch(e){ $("loginErro").textContent = e.message || "Falha no login."; }
}

// ── Relatório provisório (evolução de carga por aluno/exercício) ──
const EXALL = (function(){ const m={}; Object.values(MESES).forEach(mes=>Object.values(mes).flat().forEach(e=>{ m[e.id]=e.nome; })); return m; })();
function repFiltrados(){
  const aId=$("repAluno").value, eId=$("repExercicio").value, de=$("repDe").value, ate=$("repAte").value;
  return records.filter(r=>
    (!aId || r.alunoId===aId) && (!eId || r.exercicioId===eId) &&
    (!de || r.data>=de) && (!ate || r.data<=ate)
  ).sort((a,b)=>b.data.localeCompare(a.data));
}
function renderRelatorio(){
  const aSel=$("repAluno"), eSel=$("repExercicio"); const curA=aSel.value, curE=eSel.value;
  const alunosOrd=[...alunos].sort((x,y)=>x.nome.localeCompare(y.nome,"pt"));
  aSel.innerHTML = `<option value="">todos os alunos</option>` + alunosOrd.map(a=>`<option value="${a.id}">${he(a.nome)}</option>`).join("");
  // inclui exercícios adaptados (id ~aluno) que aparecem nos registros mas não estão no MESES
  const adaptIds=[...new Set(records.map(r=>r.exercicioId))].filter(id=>!EXALL[id]);
  eSel.innerHTML = `<option value="">todos os exercícios</option>`
    + Object.keys(EXALL).map(id=>`<option value="${id}">${he(EXALL[id])}</option>`).join("")
    + adaptIds.map(id=>`<option value="${id}">${he(nomeEx(id))} (adaptado)</option>`).join("");
  aSel.value=curA; eSel.value=curE;

  const rows=repFiltrados();
  const comCarga=rows.filter(r=>r.cargaTotal!=="" && r.cargaTotal!=null).map(r=>({d:r.data, v:parseFloat(r.cargaTotal)})).filter(x=>!isNaN(x.v));
  let kpis="";
  if(aSel.value && eSel.value && comCarga.length){
    const porData=[...comCarga].sort((a,b)=>a.d.localeCompare(b.d));
    const ultima=porData[porData.length-1].v;
    const anterior=porData.length>1?porData[porData.length-2].v:null;
    const melhor=Math.max(...comCarga.map(x=>x.v));
    const delta=anterior!=null?Math.round((ultima-anterior)*10)/10:null;
    kpis=`
      <div class="kpi"><div class="kl">Última carga</div><div class="kv">${ultima}<small> kg</small></div></div>
      <div class="kpi"><div class="kl">Melhor carga</div><div class="kv">${melhor}<small> kg</small></div></div>
      <div class="kpi"><div class="kl">Δ vs. sessão anterior</div><div class="kv">${delta!=null?(delta>0?"+":"")+delta:"—"}<small>${delta!=null?" kg":""}</small></div></div>`;
  }
  $("repKpis").innerHTML=kpis;
  $("repCharts").innerHTML=chartsBlock();
  $("repTabela").innerHTML=tabelaHTML(rows);
}

// tabela cronológica do relatório (reusada na tela e no PDF)
function tabelaHTML(rows){
  if(!rows.length) return `<p class="muted">Sem registros para esse filtro.</p>`;
  const trs=rows.map(r=>{
    const carga = (r.cargaTotal!==""&&r.cargaTotal!=null) ? he(r.cargaTotal)+" kg" : (r.cargaParcial?he(r.cargaParcial):"—");
    const montagem = r.cargaParcial? he(r.cargaParcial) : "—";
    const flags=[ r.naoRealizou?"✕ não realizou":"", (r.dor||r.dorNota)?"⚠ "+he(r.dorNota||"dor"):"", r.troca?"↻ "+he(r.troca):"", r.obs?he(r.obs):"" ].filter(Boolean).join(" · ");
    return `<tr>
      <td>${fmtD(r.data)}</td><td>T${he(r.treino)} · B${he(r.bloco)}</td>
      <td>${he(r.alunoNome)}</td><td>${he(r.exercicioNome)}</td>
      <td class="num">${carga}</td><td>${montagem}</td><td>${he(r.reps||"—")}</td><td>${he(r.rr||"—")}</td>
      <td>${flags||""}</td></tr>`;
  }).join("");
  return `<table class="reptab"><thead><tr>
    <th>Data</th><th>Treino</th><th>Aluno</th><th>Exercício</th><th>Carga</th><th>Montagem</th><th>Reps</th><th>RR</th><th>Dor / troca / obs</th>
  </tr></thead><tbody>${trs}</tbody></table>`;
}

// série de carga (kg) + reps de um aluno+exercício, no filtro de datas, ordenada por data
function serieCarga(aId, exId){
  const de=$("repDe").value, ate=$("repAte").value;
  return records.filter(r=> r.alunoId===aId && r.exercicioId===exId
      && r.cargaTotal!=="" && r.cargaTotal!=null && !isNaN(parseFloat(r.cargaTotal))
      && (!de||r.data>=de) && (!ate||r.data<=ate))
    .map(r=>({d:r.data, v:parseFloat(r.cargaTotal), reps:(r.reps||"").toString().trim()}))
    .sort((a,b)=>a.d.localeCompare(b.d));
}

// gráfico de linha em SVG puro (sem libs) — evolução de carga
function chartSVG(pts, opt){
  opt=opt||{}; const w=opt.w||300, h=opt.h||140, pad={l:32,r:14,t:20,b:34};
  if(!pts.length) return `<div class="muted" style="padding:10px 0">sem carga registrada</div>`;
  const vs=pts.map(p=>p.v), vmin=Math.min(...vs), vmax=Math.max(...vs), span=(vmax-vmin)||1;
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const X=i=> pad.l + (pts.length===1? iw/2 : iw*i/(pts.length-1));
  const Y=v=> pad.t + ih - ih*(v-vmin)/span;
  const baseY=pad.t+ih;
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  // por ponto: carga ACIMA do ponto (linha/terracota) e reps ABAIXO, na base (cinza) — amarra carga↔reps
  const marks=pts.map((p,i)=>{
    const x=X(i).toFixed(1), y=Y(p.v).toFixed(1);
    const carga=`<text x="${x}" y="${(Y(p.v)-7).toFixed(1)}" text-anchor="middle" class="cval">${p.v}</text>`;
    const reps = p.reps ? `<text x="${x}" y="${(baseY+13).toFixed(1)}" text-anchor="middle" class="creps">${he(p.reps)}</text>` : "";
    return `<circle cx="${x}" cy="${y}" r="3" fill="var(--info)"/>${carga}${reps}`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="xMidYMid meet" role="img">
    <line class="grid" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${baseY.toFixed(1)}"/>
    <line class="grid" x1="${pad.l}" y1="${baseY.toFixed(1)}" x2="${w-pad.r}" y2="${baseY.toFixed(1)}"/>
    <text x="${pad.l}" y="${(baseY+25).toFixed(1)}" class="cax">${fmtD(pts[0].d)}</text>
    <text x="${w-pad.r}" y="${(baseY+25).toFixed(1)}" class="cax" text-anchor="end">${fmtD(pts[pts.length-1].d)}</text>
    <text x="2" y="10" class="cax">kg</text>
    <text x="2" y="${(baseY+13).toFixed(1)}" class="creps">reps</text>
    <path d="${d}" fill="none" stroke="var(--info)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks}
  </svg>`;
}

// bloco de gráficos do aluno selecionado (1 grande se exercício escolhido; senão small-multiples)
function chartsBlock(){
  const aId=$("repAluno").value, eId=$("repExercicio").value;
  if(!aId) return `<p class="muted">Selecione um aluno para ver os gráficos de evolução de carga.</p>`;
  const idsCand = new Set([...Object.keys(EXALL), ...records.filter(r=>r.alunoId===aId).map(r=>r.exercicioId)]);
  // filtra sempre por série não-vazia (mesmo com exercício escolhido) — evita crash em pc/tempo/elástico
  const exIds = [...idsCand].filter(x=> (!eId || x===eId) && serieCarga(aId,x).length);
  if(!exIds.length) return `<p class="muted">Sem carga registrada para esse aluno no período (peso corporal/tempo/elástico não têm gráfico de kg).</p>`;
  const big=!!eId;
  return `<div class="charts ${big?'one':''}">` + exIds.map(ex=>{
    const s=serieCarga(aId,ex); const last=s[s.length-1].v, best=Math.max(...s.map(p=>p.v));
    return `<div class="chartcard">
      <div class="chartt">${he(nomeExDe(ex,aId))}</div>
      <div class="chartmeta">última <b>${last}kg</b> · melhor <b>${best}kg</b> · ${s.length} ${s.length===1?'sessão':'sessões'}</div>
      ${chartSVG(s,{w:big?560:300,h:big?230:130})}
    </div>`;
  }).join("") + `</div>`;
}

// gera o PDF (via impressão) do aluno selecionado, pra enviar individual
function gerarPDF(){
  const aId=$("repAluno").value;
  if(!aId){ alert("Selecione um aluno no filtro para gerar o PDF."); return; }
  const aluno=alunos.find(a=>a.id===aId)||{nome:aId};
  const rows=repFiltrados();
  const ds=rows.map(r=>r.data).sort();
  const periodo = ds.length? `${fmtD(ds[0])} a ${fmtD(ds[ds.length-1])}` : "sem registros";
  $("printArea").innerHTML = `
    <div class="pdfhead">
      <div class="pdfbrand">Fabrik — Evolução de Carga</div>
      <div class="pdfsub">${he(aluno.nome)} · período ${periodo} · gerado em ${fmtD(today())}</div>
    </div>
    ${chartsBlock()}
    <h3 class="pdfh">Histórico</h3>
    ${tabelaHTML(rows)}
    <div class="pdffoot">Registro de Carga · visão provisória · Fabrik Studio</div>`;
  window.print();
}

$("btnSair").onclick=async()=>{

};

(function(){ const s=$("status"); let tm;
  new MutationObserver(()=>{ const t=s.textContent.trim(); clearTimeout(tm);
    if(!t){ s.classList.remove("show"); return; }
    const w=t.startsWith("⚠"); s.classList.toggle("warn",w); s.classList.add("show");
    tm=setTimeout(()=>s.classList.remove("show"), w?7000:1800);
  }).observe(s,{childList:true,characterData:true,subtree:true}); })();

// exporta TUDO que está guardado neste navegador (inclui o que não subiu) — recuperação de dado
function exportarPendencias(){
  const dump = {
    exportadoEm: new Date().toISOString(),
    device: load("fabrik_device", null),
    cargas: load("fabrik_cargas", []),
    fila: load("fabrik_syncqueue", []),
    falhou: load("fabrik_sync_falhou", [])
  };
  const blob=new Blob([JSON.stringify(dump)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fabrik_pendencias_"+today()+".json"; a.click();
  const datas={}; dump.cargas.forEach(r=>{ datas[r.data]=(datas[r.data]||0)+1; });
  alert("Backup local baixado.\n\nRegistros locais: "+dump.cargas.length+
        "\nNa fila (não subiram): "+dump.fila.length+
        "\nIsolados por erro: "+dump.falhou.length+
        "\n\nEnvie o arquivo fabrik_pendencias_*.json pro suporte.");
}
